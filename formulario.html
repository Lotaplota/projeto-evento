<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrações</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Links do Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/popover.js" defer></script> <!-- Script para habilitar os hovers -->
</head>

<body class="d-flex flex-column h-100 overflow-hidden">
    <!-- Barra de navegação -->
    <nav class="d-block navbar bg-primary navbar-expand-sm pt-3 pb-0 sticky-top">
        <div class="container">
            <a href="index.html" class="navbar-brand d-flex align-items-center">
                <div class="border border-dark border-2 fs-2 rounded-3 justify-content-center align-items-center px-2">
                    <i class="bi-badge-4k-fill fs-1"></i>
                </div>
            </a>
            <div class="ms-2">
                <h2>Menu Principal</h2>
                
            </div>
            <button type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar" class="navbar-toggler">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapse da barra de navegação -->
            <div class="collapse navbar-collapse" id="menuNavbar">
                <div class="navbar-nav ms-auto text-center">
                    <div class="dropdown">
                        <a data-bs-toggle="dropdown" class="nav-link dropdown-toggle mx-3 fw-bold">Atrações</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a href="#" class="dropdown-item">Fogueira Holográfica</a>
                            </li>
                            <li>
                                <a href="#" class="dropdown-item">Correio Elegante Pneumático</a>
                            </li>
                            <li>
                                <a href="#" class="dropdown-item">Espetinho sintético</a>
                            </li>
                        </ul>
                    </div>
                    <a href="formulario.html" class="nav-link active">Quero Ajudar!</a>
                </div>
            </div>
        </div>

        <!-- Breadcrumbs -->
        <nav class="breadcrumb mb-0 text-primary bg-dark w-100">
            <a href="index.html" class="breadcrumb-item text-primary text-decoration-none px-1 fs-5 fw-bold">O Terreiro Virtual</a>
            <a href="#" class="breadcrumb-item text-primary text-decoration-none px-1 fs-5 fw-bold">Quero Ajudar</a>
        </nav>
    </nav>

    <!-- Conteúdo da página -->
    <div class="container-md p-0 bg-light bg-opacity-75 formulario">
        <div class="display-2 text-center">Quero Ajudar!</div>
        <div class="lead text-center">Quer ajudar na nossa festa? Preencha o seguinte formulário e simbora!</div>

        <div class="row mx-3 g-3">
            <!-- Input nome -->
            <div class="col-12 col-md-7">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Insira o seu nome completo">
            </div>

            <!-- Input e-mail -->
            <div class="col-6 col-md-5" id="grupoEmail">
                <label for="usuarioEmail" class="form-label">Email</label>
                <div class="input-group">
                    <input type="text" class="form-control text-end" name="" id="usuarioEmail" placeholder="fulano_de_tal">
                    <label for="" class="input-group-text">@</label>
                    <input type="text" class="form-control" placeholder="correio.com">
                </div>
            </div>

            <!-- Input animação -->
            <div class="col-6 col-md-6" id="grupoAnimacao">
                <label for="" class="form-label">Nível de Animação</label>
                <div class="btn-group w-100" role="group">
                    <input type="radio" name="nivelAnimacao" id="btn1" class="btn-check">
                    <label for="btn1" class="btn btn-outline-warning">🌽</label>
                    <input type="radio" name="nivelAnimacao" id="btn2" class="btn-check">
                    <label for="btn2" class="btn btn-outline-warning">🌽</label>
                    <input type="radio" name="nivelAnimacao" id="btn3" class="btn-check">
                    <label for="btn3" class="btn btn-outline-warning">🌽</label>
                    <input type="radio" name="nivelAnimacao" id="btn4" class="btn-check">
                    <label for="btn4" class="btn btn-outline-warning">🌽</label>
                    <input type="radio" name="nivelAnimacao" id="btn5" class="btn-check">
                    <label for="btn5" class="btn btn-outline-warning">🌽</label>
                </div>
            </div>

            <!-- Input minha prenda -->
            <div class="col-4 col-md-6" id="grupoPrenda">
                <div class="d-flex">
                    <label for="prenda" class="form-label">Minha prenda Tecnológica</label>
                    <div type="button" class="ms-1" data-bs-trigger="hover" data-bs-toggle="popover" data-bs-html="true" data-bs-content="Sua prenda seria qualquer objeto que você que possa trazer que esteja dentro do tema, desde uma <em>fogueira</em> até uma <em>sanfona</em>😉"><i class="bi-info-circle-fill"></i></div>
                </div>
                <div class="d-flex">
                    <input type="text" class="form-control" id="prenda">
                    <div id="easterEgg"></div> <!-- Aqui entra o easter egg que ela pediu, mas vai precisar de um pouquinho de JavaScript... -->
                </div>
            </div>

            <!-- Input disponibilidade -->
            <div class="col-8 col-md-6" id="grupoDisp">
                <div class="form-label">Disponibilidade</div>
                <div class="btn-group" id="dfasd">
                    <input type="checkbox" id="btnDisp1" class="btn-check">
                    <label for="btnDisp1" class="btn btn-outline-success">Preparativos</label>
                    <input type="checkbox" id="btnDisp2" class="btn-check">
                    <label for="btnDisp2" class="btn btn-outline-success">Durante a festa</label>
                    <input type="checkbox" id="btnDisp3" class="btn-check">
                    <label for="btnDisp3" class="btn btn-outline-success">Desmonte</label>
                </div>
            </div>

            <!-- Input enviar -->
            <div class="col-12 col-md-6">
                <button type="submit" class="btn btn-primary h-100 w-100 fs-2 fw-medium">Enviar</button>
            </div>
        </div>
    </div>

    <footer class="align-bottom text-bg-dark sticky-bottom text-center align-content-center" style="min-height: 100px;">© Todos os direitos reservados.</footer>
</body>
