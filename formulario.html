                        <a data-bs-toggle="dropdown" class="nav-link dropdown-toggle mx-3 fw-bold">Atrações</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>

    <!-- Conteúdo da página -->
    <div class="container p-0 bg-light bg-opacity-75">
        <div class="display-2 text-center">Quero Ajudar!</div>
        <div class="lead text-center">Quer ajudar na nossa festa? Preencha o seguinte formulário e simbora!</div>

        <div class="row mx-3 g-3">
            <div class="col-12">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Insira o seu nome completo">
            </div>

            <div class="col-7" id="grupoEmail">
                <label for="usuarioEmail" class="form-label">Email</label>
                <div class="input-group">
                    <input type="text" class="form-control text-end" name="" id="usuarioEmail" placeholder="fulano_de_tal">
                    <label for="" class="input-group-text">@</label>
                    <input type="text" class="form-control" placeholder="correio.com">
                </div>
            </div>

            <div class="col-5">
                <label for="" class="form-label">Nível de Animação</label>
                <div class="btn-group" role="group">
                    <input type="radio" name="nivelAnimacao" id="btn1" class="btn-check">
                    <label for="btn1" class="btn btn-outline-danger">🌽</label>
                    <input type="radio" name="nivelAnimacao" id="btn2" class="btn-check">
                    <label for="btn2" class="btn btn-outline-danger">🌽</label>
                    <input type="radio" name="nivelAnimacao" id="btn3" class="btn-check">
                    <label for="btn3" class="btn btn-outline-danger">🌽</label>
                    <input type="radio" name="nivelAnimacao" id="btn4" class="btn-check">
                    <label for="btn4" class="btn btn-outline-danger">🌽</label>
                    <input type="radio" name="nivelAnimacao" id="btn5" class="btn-check">
                    <label for="btn5" class="btn btn-outline-danger">🌽</label>
                </div>
            </div>

            <div class="col-6">
                <div class="d-flex">
                    <label for="prenda" class="form-label">Minha prenda Tecnológica</label>
                    <div type="button" class="ms-1" data-bs-trigger="hover" data-bs-toggle="popover" data-bs-html="true" data-bs-content="Sua prenda seria qualquer objeto que você que possa trazer que esteja dentro do tema, desde uma <em>fogueira</em> até uma <em>sanfona</em>😉"><i class="bi-info-circle-fill"></i></div>
                </div>
                <div class="d-flex">
                    <input type="text" class="form-control" id="prenda">
                    <div id="easterEgg"></div>
                </div>
            </div>

            <div class="col-6">
                <label for="" class="form-label"></label>
                <input type="text" class="form-control">
